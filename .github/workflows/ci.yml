name: Library contracts
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Local release webhook contracts
        shell: powershell
        run: node --test tests/release/pipeline.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: C and C++ package contracts
        shell: powershell
        run: .\build.ps1 -Task c
      - name: Java and JNI contracts
        shell: powershell
        run: .\build.ps1 -Task java -Native
      - name: Maven sources and Javadoc
        shell: powershell
        run: .\build.ps1 -Task maven
